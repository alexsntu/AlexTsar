<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Портал автопарка</title>
<script>
  // Локально (MacBook): Fleet App на отдельном порту.
  // На VPS за Traefik (см. docker-compose.vps.yml): поддомен app.
  var host = window.location.hostname;
  var proto = window.location.protocol;
  var port = window.location.port;
  var erpHref = port ? proto + "//" + host + ":8000" : proto + "//app." + host;
  window.location.replace(erpHref);
</script>
<meta http-equiv="refresh" content="0; url=#" id="refresh-fallback" />
</head>
<body style="background:#0f1115;color:#9aa1ac;font-family:-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;">
  <p>Переход в приложение… <a id="fallback-link" href="#" style="color:#4f8cff;">открыть вручную</a></p>
  <script>
    document.getElementById("fallback-link").href = erpHref;
    document.getElementById("refresh-fallback").content = "0; url=" + erpHref;
  </script>
</body>
</html>
