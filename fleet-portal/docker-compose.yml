services:
  # ---------- Fleet App: топливо, рейсы, задания водителям ----------
  fleet-app:
    build:
      context: ./app
    image: fleet-app:${FLEET_APP_TAG:-latest}
    pull_policy: never
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/data/fleet.db
      JWT_SECRET: ${FLEET_JWT_SECRET}
      ADMIN_EMAIL: ${FLEET_ADMIN_EMAIL:-admin@fleet.local}
      ADMIN_PASSWORD: ${FLEET_ADMIN_PASSWORD}
      NODE_ENV: production
    volumes:
      - fleet-app-data:/data
    ports:
      - "${FLEET_APP_HTTP_PORT:-8000}:3000"

  # ---------- Портал: единая стартовая страница ----------
  portal:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./portal:/usr/share/nginx/html:ro
    ports:
      - "${PORTAL_HTTP_PORT:-8888}:80"

volumes:
  fleet-app-data:
