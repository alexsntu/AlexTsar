# Оверлей для VPS: Traefik + Let's Encrypt + реальные домены.
# Использовать вместе с основным файлом:
#
#   docker compose -p fleet -f docker-compose.yml -f docker-compose.vps.yml up -d
#
# Перед запуском добавьте в .env:
#   DOMAIN=example.ru
#   ACME_EMAIL=you@example.ru
#
# И настройте DNS A-записи (на IP вашего VPS):
#   example.ru          -> портал (лендинг со ссылками)
#   app.example.ru      -> Fleet App (топливо, рейсы, ТО)

services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt

  fleet-app:
    ports: !reset []
    labels:
      - traefik.enable=true
      - traefik.http.routers.fleet-app.rule=Host(`app.${DOMAIN}`)
      - traefik.http.routers.fleet-app.entrypoints=websecure
      - traefik.http.routers.fleet-app.tls.certresolver=le
      - traefik.http.routers.fleet-app.middlewares=security-headers
      - traefik.http.services.fleet-app.loadbalancer.server.port=3000
      - traefik.http.middlewares.security-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.security-headers.headers.stsPreload=true
      - traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.security-headers.headers.frameDeny=true
      - traefik.http.middlewares.security-headers.headers.browserXssFilter=true

  portal:
    ports: !reset []
    labels:
      - traefik.enable=true
      - traefik.http.routers.portal.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.portal.entrypoints=websecure
      - traefik.http.routers.portal.tls.certresolver=le
      - traefik.http.routers.portal.middlewares=security-headers@docker
      - traefik.http.services.portal.loadbalancer.server.port=80

volumes:
  traefik-letsencrypt:
